<div
  class="content d-flex flex-column justify-content-center align-content-center text-center align-items-center gap-2"
  role="main"
  style="min-height: 100vh; width: auto"
>
  <h1 class="text-dark">Module Champ d'applications</h1>
  <h2 class="text-success">{{ nomSeance }}</h2>
  <span class="bg-info text-dark text-center">{{ resumeSeance }}</span>

  <div class="card-container">
    <div class="row">
      <div class="col-xs-12">
        <h2>Liste étudiants</h2>
        <ul class="list-unstyled">
          <app-etudiant
            nom="Lorel"
            prenom="Guillaume"
            [statut]="statutEtudiants()"
          ></app-etudiant>
          <app-etudiant
            nom="Martin"
            prenom="Jean"
            [statut]="statutEtudiants()"
          ></app-etudiant>
          <app-etudiant
            nom="Dupont"
            prenom="Marie"
            [statut]="statutEtudiants()"
          ></app-etudiant>
        </ul>
      </div>
    </div>
  </div>

  <button [disabled]="!isAuth" (click)="rendTousPres()" class="btn btn-success">
    Tous présents
  </button>
</div>

<router-outlet />
