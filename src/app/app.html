<div
  class="content d-flex flex-column justify-content-center align-content-center text-center align-items-center gap-2"
  role="main"
  style="min-height: 100vh; width: auto; max-width: 600px; margin: auto"
>
  <h1 class="text-dark">Module Champ d'applications</h1>
  <h2 class="text-success">{{ nomSeance }}</h2>
  <span class="bg-info text-dark text-center">{{ resumeSeance }}</span>

  <div class="card-container w-100">
    <div class="row">
      <div class="col-xs-12">
        <h2>Liste étudiants</h2>

        <!-- 2.4 - une fiche générée par entrée du tableau tabEtudiant -->
        <ul class="list-group">
          <app-etudiant
            *ngFor="let etu of tabEtudiant"
            [nom]="etu.nom"
            [prenom]="etu.prenom"
            [present]="etu.present"
            [commentaire]="commentaireSeance"
          ></app-etudiant>
        </ul>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button
      [disabled]="!isAuth"
      (click)="rendTousPres()"
      class="btn btn-success"
    >
      Tous présents
    </button>
    <!-- 4.4 -->
    <button [disabled]="!isAuth" (click)="rendTousAbs()" class="btn btn-danger">
      Tous absents
    </button>
  </div>

  <div
    class="text-left d-flex flex-column gap-2 align-items-start align-self-start mt-6"
  >
    <label for="commentaire">Commentaire :</label>
    <!-- 1.3 - liaison à double sens [(ngModel)] -->
    <input
      type="text"
      class="form-control"
      [(ngModel)]="commentaireSeance"
      id="commentaire"
    />
    <p>{{ commentaireSeance }}</p>
  </div>
</div>

<router-outlet />
